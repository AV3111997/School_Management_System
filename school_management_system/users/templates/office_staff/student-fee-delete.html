{% extends 'shared/base.html' %}
{% block title %}
<title>Fee Record Delete</title>
{% endblock %}
{% block content %}
<div class="container col-md-8 bg-light py-5 h-100 section-divider">
    <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-md-8">
            <div class="card bg-light text-dark shadow" style="border-radius: 1rem;">
                <div class="card-body p-5  text-center">
                    <div class="mb-md-4 mt-md-4 pb-5">
                        <h2 class="fw-bold mb-2 text-uppercase">Delete Fee Record</h2>
                        <p class="text-center">Are you sure you want to delete this record?</p>
                        <p class="text-center">FEE RECORD DATED: <strong>{{ student_fee.date_paid }}</strong></p>
                        <form method="POST" action="{% url 'student-fee-delete' student_fee.student.pk student_fee.pk %}">
                            {% csrf_token %}
                            <button data-mdb-button-init data-mdb-ripple-init
                                class="btn btn-outline-danger btn-lg px-5" type="submit">Delete</button>
                            <a href="{% url 'student-fee-details-list' student_fee.pk %}" class="btn btn-primary btn-lg px-5">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
